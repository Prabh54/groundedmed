# M0-T5: lint + unit/leakage tests on every push. One secret: DATABASE_URL (read-only DB role) for the live-DB checks.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Cache PubMedQA download (pinned revision)
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/huggingface/hub
          key: pubmedqa-9001f2853fb87cab8d220904e0de81ac6973b318

      - name: Install (locked)
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # Fails if the committed (frozen) manifests would change; also builds data/corpus.jsonl.
      - name: Rebuild dataset and check frozen manifests
        run: |
          uv run python -m scripts.prepare_dataset
          git status --porcelain --untracked-files=all -- data
          test -z "$(git status --porcelain --untracked-files=all -- data)"

      # DATABASE_URL = the read-only runtime role (repository secret): runs the live-database integrity and
      # read-only checks in backend/tests/integration/test_database.py. Empty (tests skip) where the secret is
      # unavailable, e.g. pull requests from forks. No admin URL or API keys are given to CI.
      - name: Tests (unit + leakage)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run pytest -v

  # M5: frontend type check, unit tests, production build, /eval number check and browser tests
  # (no secrets; the API URL is a placeholder; the browser tests use the fake API only).
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (locked)
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Fonts are self-hosted (M6-F3); block Google Fonts so a build that downloads them fails here.
      - name: Block Google Fonts
        run: |
          echo "0.0.0.0 fonts.googleapis.com fonts.gstatic.com" | sudo tee -a /etc/hosts
          ! curl -sS -m 5 -o /dev/null https://fonts.googleapis.com

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000

      # M5-T5: every number on the built /eval page equals its stored result-file value (ADR-016).
      - name: Check /eval numbers against the result files
        run: npm run check:eval

      # M5-T6: browser tests (Playwright, e2e/) against the fake API only (scripts/mock-api.mjs): no paid calls.
      # They build their own copy of the app into .next-e2e (playwright.config.ts).
      - name: Install the test browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests (fake API, $0)
        run: npm run test:e2e
