[project]
name = "groundedmed"
version = "0.1.0"
description = "Grounded biomedical research analyst over PubMedQA (portfolio demo, not medical advice)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.1.0",
    "fastapi>=0.161.1",
    "langgraph>=1.2.16",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
    "voyageai>=0.5.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "huggingface-hub>=2.2.0",
    "pyarrow>=26.0.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.uv]
# Not installed as a package: code runs from the repo root, so `backend.app`, `eval`
# and `scripts` import the same way under pytest, `python -m scripts.x` and uvicorn.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs/reference"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.format]
# Code blocks in the docs are illustrative, not source.
exclude = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib", "--strict-markers"]
markers = ["real_advice_screen: run the API's real personal-advice screen (backend/tests/unit/conftest.py)"]
# Print a stack trace for any test still running after 2 minutes, so a hang is diagnosable.
faulthandler_timeout = 120
